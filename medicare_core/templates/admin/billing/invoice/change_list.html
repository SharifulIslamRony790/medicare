{% extends 'admin/change_list.html' %}

{% block content %}
<div class="saas-kpi-grid">
    <div class="saas-kpi-card">
        <h3 class="saas-kpi-title">Total Invoices</h3>
        <p class="saas-kpi-value">{{ kpi_total_invoices }}</p>
    </div>
    <div class="saas-kpi-card">
        <h3 class="saas-kpi-title">Total Revenue</h3>
        <p class="saas-kpi-value">${{ kpi_total_revenue|floatformat:2 }}</p>
    </div>
    <div class="saas-kpi-card">
        <h3 class="saas-kpi-title">Unpaid Invoices</h3>
        <p class="saas-kpi-value">{{ kpi_unpaid }}</p>
    </div>
</div>
{{ block.super }}
{% endblock %}
