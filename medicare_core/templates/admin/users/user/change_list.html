{% extends 'admin/change_list.html' %}

{% block content %}
<div class="saas-kpi-grid">
    <div class="saas-kpi-card">
        <h3 class="saas-kpi-title">Total Users</h3>
        <p class="saas-kpi-value">{{ kpi_total_users }}</p>
    </div>
    <div class="saas-kpi-card">
        <h3 class="saas-kpi-title">Active Users</h3>
        <p class="saas-kpi-value">{{ kpi_active_users }}</p>
    </div>
    <div class="saas-kpi-card">
        <h3 class="saas-kpi-title">Total Doctors</h3>
        <p class="saas-kpi-value">{{ kpi_doctors }}</p>
    </div>
</div>
{{ block.super }}
{% endblock %}
