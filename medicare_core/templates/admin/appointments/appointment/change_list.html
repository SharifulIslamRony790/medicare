{% extends 'admin/change_list.html' %}

{% block content %}
<div class="saas-kpi-grid">
    <div class="saas-kpi-card">
        <h3 class="saas-kpi-title">Total Appointments</h3>
        <p class="saas-kpi-value">{{ kpi_total }}</p>
    </div>
    <div class="saas-kpi-card">
        <h3 class="saas-kpi-title">Today's Appointments</h3>
        <p class="saas-kpi-value">{{ kpi_today }}</p>
    </div>
    <div class="saas-kpi-card">
        <h3 class="saas-kpi-title">Pending Appointments</h3>
        <p class="saas-kpi-value">{{ kpi_pending }}</p>
    </div>
</div>
{{ block.super }}
{% endblock %}
